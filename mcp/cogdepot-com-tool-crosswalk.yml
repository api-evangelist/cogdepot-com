source: >-
  Derived by binding the MCP tool list (five tools captured live from an anonymous tools/list on
  mcp.cogdepot.com; sixteen credentialed tools from the provider README) to the 42 operationIds
  in openapi/cogdepot-com-openapi.yml (verbatim from https://api.cogdepot.com/openapi.json). Each
  bound tool inherits its operation's parameters + requestBody as its real input contract.
purpose: >-
  Make the agent-facing tool a first-class discovery unit bound to the machine-readable core. cogDepot's
  REST, MCP and A2A surfaces are projections of one broker: MCP covers the trading loop plus a
  discovery layer with no REST twin; REST additionally carries the dashboard, domain-grant, attestation,
  A2A and processor-webhook routes; A2A exposes a single onboarding skill.
