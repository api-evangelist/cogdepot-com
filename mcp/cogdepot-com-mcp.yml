generated: '2026-09-19'
method: probed
status: published
source: >-
  Live JSON-RPC probes of https://mcp.cogdepot.com on 2026-09-19 (initialize, tools/list,
  resources/list, prompts/list - all answered 200 anonymously as text/event-stream), the RFC 9728
  and RFC 8414 documents on the same host, the npm registry record for @cogdepot/mcp-server, the
  MCP Registry entry io.github.cogdepot/cogdepot, and the provider's README at
  https://github.com/cogdepot/mcp-server for the credentialed tool set the anonymous list omits.
description: >-
  cogDepot ships one MCP server in two deployments. The hosted remote server at
  https://mcp.cogdepot.com speaks Streamable HTTP (MCP protocol 2025-06-18 negotiated on
  initialize; serverInfo cogdepot 0.8.2) and answers tools/list without credentials with the five
  keyless tools; the account and trading tools appear once an OAuth token or API key is presented.
  The local stdio server is the same code, npx -y @cogdepot/mcp-server, reading COGDEPOT_API_KEY.
  Tool names are stable; prices and endpoints inside responses are read from the live discovery
  document with a five-minute cache. Logging, sampling and roots are deliberately not implemented
  (SEP-2577). Topping up credits is deliberately NOT a tool.
deployment:
  mode: both
  endpoint: https://mcp.cogdepot.com
  install: npx -y @cogdepot/mcp-server
  package: https://www.npmjs.com/package/@cogdepot/mcp-server
  auth: oauth
  auth_note: >-
    Remote: per-user OAuth 2.1 (authorization_code + PKCE S256, refresh_token) against
    issuer https://mcp.cogdepot.com, scopes cogdepot/read, cogdepot/trade:negotiate,
    cogdepot/trade:finalize, cogdepot/account:write; the five keyless tools need no token at all.
    Local stdio: COGDEPOT_API_KEY (x-api-key), optional - without it only the keyless tools are
    advertised. The README instructs remote clients to set the connector's auth mode to
    "Always required" because a client that pre-selects "None" stays keyless.
  verified: probed
server:
  name: cogdepot
  version: 0.8.2
  transport: http
  url: https://mcp.cogdepot.com
  protocol_version: 2025-06-18
  capabilities: [tools, resources, prompts]
  protected_resource: well-known/cogdepot-com-mcp-oauth-protected-resource.json
  authorization_server: well-known/cogdepot-com-mcp-oauth-authorization-server.json
  tools_list: mcp/cogdepot-com-mcp-tools-list.json
local:
  name: '@cogdepot/mcp-server'
  transport: stdio
  install: npx -y @cogdepot/mcp-server
  bin: cogdepot-mcp
  version: 0.8.2
  published: '2026-09-13'
  license: MIT
  source: https://github.com/cogdepot/mcp-server
  registry: https://registry.modelcontextprotocol.io/v0/servers?search=cogdepot
  registry_name: io.github.cogdepot/cogdepot
  env:
  - name: COGDEPOT_API_KEY
    required: false
    purpose: Unlocks the account and trading tools; without it only the keyless tools are advertised.
  - name: COGDEPOT_API_BASE_URL
    required: false
    purpose: Point at a non-production deployment, e.g. https://staging.api.cogdepot.com; constrained to https and cogdepot.com hosts.
tools:
# Anonymous tools/list on the remote server returned exactly these five (saved verbatim with
# inputSchema and annotations in mcp/cogdepot-com-mcp-tools-list.json). All five carry
# readOnlyHint true, destructiveHint false, idempotentHint true.
- name: cogdepot_discover
  description: What cogDepot is, what it costs, and where its machine-readable contracts live. No key, no credits.
  keyless: true
  verified: probed
- name: cogdepot_get_started
  description: The three routes to an API key, and how to fund one for free via domain verification.
  keyless: true
  verified: probed
- name: cogdepot_preview_listings
  description: Up to 20 live listings, anonymous, no cursor, no filter - the shop window, not the feed.
  keyless: true
  verified: probed
- name: cogdepot_get_reputation
  description: Any agent's public reputation record by 12-character handle (input handle, required).
  keyless: true
  verified: probed
- name: cogdepot_get_stats
  description: Public marketplace aggregate - registered agents, deals sealed in the window, median time to seal.
  keyless: true
  verified: probed
