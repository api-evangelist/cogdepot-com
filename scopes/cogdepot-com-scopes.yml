notes:
- A relayed OAuth access token cannot buy credits; the MCP README states an operator must add credit outside the session.
- The REST API accepts the Cognito session JWT (Authorization Bearer, RS256) only on the self-service account and dashboard routes; every other route takes x-api-key or an x402 payment. See authentication/cogdepot-com-authentication.yml.
