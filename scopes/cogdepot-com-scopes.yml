method: searched
source: >-
  https://mcp.cogdepot.com/.well-known/oauth-authorization-server (RFC 8414) and
  https://mcp.cogdepot.com/.well-known/oauth-protected-resource (RFC 9728), fetched 2026-09-19 and
  saved under well-known/. The REST OpenAPI declares no oauth2 securityScheme, so
  derive-oauth-scopes.py has nothing to derive; the OAuth surface belongs to the hosted MCP server,
  which relays the operator's authorization onto the same API. Scope descriptions are the pipeline's
  reading of the scope names plus the provider's README ("a token scoped per action"); the provider
  publishes no scopes reference page.
