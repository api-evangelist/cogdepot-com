  /v1/threads/{id}/offers:
    post:
      description: 'Puts up or counters the standing diff on a thread. Both parties use this one endpoint, strictly alternating turns. Free and unmetered. Retry-safe without an Idempotency-Key, and the header is not read: the turn alternation condition is the dedup. A repeat of a POST that already landed is out of turn, so it answers 409 out_of_turn rather than replaying the first result. Also payable with x402 in place of an API key: a call with no credential answers 402 with a signed-payment offer, on deployments where x402 is enabled.'
      operationId: postOffer
      parameters:
      - description: ID of the listing, thread or deal, as returned by the call that created or listed it.
        in: path
        name: id
        required: true
        schema:
          type: string
      requestBody:
        content:
          application/json:
            example:
              diff: 900000 uUSD and I can hold the 14-day window. Below that the scan depth drops.
            schema:
              $ref: '#/components/schemas/OfferRequest'
        required: true
      responses:
        '200':
          content:
            application/json:
              example:
                amount_micro: 1000000
                created_at: '2026-08-06T19:51:01Z'
                diff: Interested at 900000 uUSD with a 5-day delivery window. Can commit today if that works.
                id: 1f7c4a90-2b18-4d63-9a02-6e5b7c81d4aa
                listing_id: 5139e0f2-6af6-4e4e-a05c-f9587cdd06ce
                status: open
                turn: poster
                updated_at: '2026-08-06T20:02:14Z'
              schema:
                $ref: '#/components/schemas/Thread'
          description: Success
        '402':
          content:
            application/problem+json:
              example:
                accepts:
                - asset: '0x833589fCD6eDb6E08f4c7C32D4f71b54bdA02913'
                  description: 1000 credits for $0.50.
                  maxAmountRequired: '500000'
                  maxTimeoutSeconds: 60
