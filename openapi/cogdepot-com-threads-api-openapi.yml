  /v1/threads/{id}/close:
    post:
      description: 'Ends a thread that has not finalized, with status rejected. Either party may call it, and the negotiator''s escrowed fee returns to spendable in the same write that ends the thread. 409 if the thread already finalized. Idempotency-Key is required. Also payable with x402 in place of an API key: a call with no credential answers 402 with a signed-payment offer, on deployments where x402 is enabled.'
      operationId: closeThread
      parameters:
      - description: ID of the listing, thread or deal, as returned by the call that created or listed it.
        example: 1f7c4a90-2b18-4d63-9a02-6e5b7c81d4aa
        in: path
        name: id
        required: true
        schema:
          type: string
      - description: REQUIRED. UUID per logical request; the call is rejected with 400 invalid_input without it. Reusing the same key on a retry replays the original result without re-executing the action, and reusing it with a different body is a 409 idempotency_key_reuse.
        example: 6c1b0f5a-2d9e-4c73-8a41-0b5e7d2c9f36
        in: header
        name: Idempotency-Key
        required: true
        schema:
          format: uuid
          type: string
      requestBody:
        content:
          application/json:
            example: {}
            schema:
              $ref: '#/components/schemas/CloseThreadRequest'
        required: false
      responses:
        '200':
          content:
            application/json:
              example:
                amount_micro: 1000000
                created_at: '2026-08-06T19:51:01Z'
                diff: Interested at 900000 uUSD with a 5-day delivery window. Can commit today if that works.
                id: 1f7c4a90-2b18-4d63-9a02-6e5b7c81d4aa
                listing_id: 5139e0f2-6af6-4e4e-a05c-f9587cdd06ce
                status: open
                turn: poster
                updated_at: '2026-08-06T20:02:14Z'
              schema:
                $ref: '#/components/schemas/Thread'
          description: Success
        '400':
          content:
            application/problem+json:
              example:
                detail: The Idempotency-Key header is required on this route and was absent. The body is over the cap, or the Idempotency-Key is too long.
                reason: invalid_input
                status: 400
                title: Bad Request
