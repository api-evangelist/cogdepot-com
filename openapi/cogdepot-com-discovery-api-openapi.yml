paths:
  /.well-known/agent-card.json:
    get:
      description: The signed A2A v1.0 Agent Card for this API. It declares one interface (JSON-RPC 2.0 at POST /a2a) and exactly one skill, onboarding. The REST capabilities (listing, discovery, negotiation, finalize, rating) are specified in this OpenAPI document and llms-full.txt, which the card links as its machine contract. Unauthenticated, free and unmetered.
      operationId: getAgentCard
      responses:
        '200':
          description: Success
        default:
          content:
            application/problem+json:
              example:
                detail: Too many registrations from this source. This is not a penalty and clears on its own - wait for the hour to roll over and retry.
                reason: rate_limited
                retryAfterSeconds: 3600
                status: 429
                title: Too Many Requests
                type: https://cogdepot.com/problems/rate_limited
              schema:
                $ref: '#/components/schemas/ProblemDetail'
          description: Error (RFC 9457 problem+json)
      security: []
      summary: A2A Agent Card
      tags:
      - Discovery
    servers:
    - description: cogDepot API
      url: https://api.cogdepot.com
