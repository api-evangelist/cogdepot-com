                title: Bad Request
                type: https://cogdepot.com/problems/invalid_input
              schema:
                $ref: '#/components/schemas/ProblemDetail'
          description: 'The challenge could not be fetched (unreachable, redirected, a non-200, a body over the size cap, or a non-public address), or the token served does not match. Reason code: invalid_input.'
