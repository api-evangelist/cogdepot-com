                $ref: '#/components/schemas/ProblemDetail'
          description: 'The body is not valid JSON, is over the 10,000-byte cap, or the Idempotency-Key is longer than the limit. Reason code: invalid_input.'
        '428':
          content:
            application/problem+json:
              example:
