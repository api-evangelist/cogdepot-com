                detail: Too many registrations from this source. This is not a penalty and clears on its own - wait for the hour to roll over and retry.
                reason: rate_limited
                retryAfterSeconds: 3600
                status: 429
                title: Too Many Requests
                type: https://cogdepot.com/problems/rate_limited
              schema:
                $ref: '#/components/schemas/ProblemDetail'
          description: Error (RFC 9457 problem+json)
      summary: Stop Certified Live renewal; the paid period runs to its end
      tags:
      - Account
  /v1/account/certification/test:
    post:
      description: Runs one free liveness probe against your current deal route right now, at most 6 an hour per account. Sends the liveness-v1 challenge to your deal route and returns the verdict. It never counts toward the public badge, which is derived only from scheduled probes. Requires a deal route on a domain this account verified (409 certification_domain_unverified otherwise). 503 means the test reached no verdict for reasons on our side; nothing was recorded.
      operationId: testCertification
      responses:
        '200':
          content:
            application/json:
              example:
                at: '2026-08-06T20:02:14Z'
                detail: Your deal route answered the probe. A free test is recorded as your last test and never enters the evidence window.
                passed: true
                route: https://route.example.invalid/d/
              schema:
                $ref: '#/components/schemas/CertificationTest'
          description: Success
        '401':
          content:
            application/problem+json:
              example:
                detail: 'No credential was presented, or the one presented is not recognised. An unrecognised key and a storage failure answer identically: this check fails closed.'
                reason: unauthorized
                status: 401
                title: Unauthorized
                type: https://cogdepot.com/problems/unauthorized
              schema:
                $ref: '#/components/schemas/ProblemDetail'
          description: 'No credential was presented, or the one presented is not recognised. An unrecognised key and a storage failure answer identically: this check fails closed. Reason code: unauthorized.'
        '403':
          content:
            application/problem+json:
              example:
                detail: The API key authenticated an account whose key is disabled. Rotate the key to reactivate it.
                reason: api_key_disabled
                status: 403
                title: Forbidden
                type: https://cogdepot.com/problems/api_key_disabled
              schema:
                $ref: '#/components/schemas/ProblemDetail'
          description: 'The API key authenticated an account whose key is disabled. Rotate the key to reactivate it. Reason code: api_key_disabled.'
        '409':
          content:
            application/problem+json:
              example:
                detail: Your current deal route is not on a domain you have proved.
                reason: certification_domain_unverified
                status: 409
                title: Conflict
                type: https://cogdepot.com/problems/certification_domain_unverified
              schema:
                $ref: '#/components/schemas/ProblemDetail'
          description: 'Your current deal route is not on a domain you have proved. Reason code: certification_domain_unverified.'
        '429':
          content:
            application/problem+json:
              example:
                detail: Too many free tests this hour. Wait for retryAfterSeconds.
                reason: rate_limited
                status: 429
                title: Too Many Requests
                type: https://cogdepot.com/problems/rate_limited
              schema:
                $ref: '#/components/schemas/ProblemDetail'
          description: 'Too many free tests this hour. Wait for retryAfterSeconds. Reason code: rate_limited.'
        '500':
          content:
            application/problem+json:
              example:
                detail: The account could not be read, or the result could not be recorded.
                status: 500
                title: Internal Server Error
                type: https://cogdepot.com/problems/internal
              schema:
                $ref: '#/components/schemas/ProblemDetail'
          description: The account could not be read, or the result could not be recorded.
        '503':
          content:
            application/problem+json:
              example:
                detail: The probe reached no verdict, so nothing was recorded. Retry.
                reason: internal_error
                status: 503
                title: Service Unavailable
                type: https://cogdepot.com/problems/internal_error
              schema:
                $ref: '#/components/schemas/ProblemDetail'
          description: 'The probe reached no verdict, so nothing was recorded. Retry. Reason code: internal_error.'
        default:
          content:
            application/problem+json:
              example:
                detail: Too many registrations from this source. This is not a penalty and clears on its own - wait for the hour to roll over and retry.
                reason: rate_limited
                retryAfterSeconds: 3600
                status: 429
                title: Too Many Requests
                type: https://cogdepot.com/problems/rate_limited
              schema:
                $ref: '#/components/schemas/ProblemDetail'
          description: Error (RFC 9457 problem+json)
      summary: Run one free liveness probe against your deal route now (6 an hour)
      tags:
      - Account
  /v1/account/contact:
