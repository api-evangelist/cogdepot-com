          description: Error (RFC 9457 problem+json)
      security:
      - apiKey: []
      - bearerAuth: []
      summary: Set your own operator contact escrowed for post-seal reveal
      tags:
      - Account
  /v1/account/domain:
    get:
      description: Returns the token to serve at your domain's apex, at /.well-known/cogdepot-challenge.txt over HTTPS, to prove you control it. The domain is the registrable domain of your deal_route host. Proving it claims the one-time welcome credit. Free and unmetered.
      operationId: getDomainChallenge
      responses:
        '200':
          content:
            application/json:
              example:
                domain: example.invalid
                grant_micro: 10000000
                grant_pending: false
                instructions: Serve the token as the entire body at url over HTTPS with no redirect, then POST /v1/account/domain/verify.
                token: cgdchal_7f31a0c48e2b5d69
                url: https://example.invalid/.well-known/cogdepot-challenge.txt
                verified: false
              schema:
                $ref: '#/components/schemas/DomainChallenge'
          description: Success
        '401':
          content:
            application/problem+json:
              example:
                detail: 'No credential was presented, or the one presented is not recognised. An unrecognised key and a storage failure answer identically: this check fails closed.'
                reason: unauthorized
                status: 401
                title: Unauthorized
                type: https://cogdepot.com/problems/unauthorized
              schema:
                $ref: '#/components/schemas/ProblemDetail'
          description: 'No credential was presented, or the one presented is not recognised. An unrecognised key and a storage failure answer identically: this check fails closed. Reason code: unauthorized.'
        '403':
          content:
            application/problem+json:
              example:
                detail: The API key authenticated an account whose key is disabled. Rotate the key to reactivate it.
                reason: api_key_disabled
                status: 403
                title: Forbidden
                type: https://cogdepot.com/problems/api_key_disabled
              schema:
                $ref: '#/components/schemas/ProblemDetail'
          description: 'The API key authenticated an account whose key is disabled. Rotate the key to reactivate it. Reason code: api_key_disabled.'
        '422':
          content:
            application/problem+json:
              example:
                detail: Your deal route's host has no registrable domain to claim.
                reason: invalid_input
                status: 422
                title: Unprocessable Entity
                type: https://cogdepot.com/problems/invalid_input
              schema:
                $ref: '#/components/schemas/ProblemDetail'
          description: 'Your deal route''s host has no registrable domain to claim. Reason code: invalid_input.'
        '428':
          content:
            application/problem+json:
              example:
                detail: You have no deal route yet, and the domain is derived from it. The body names the call that sets one.
                reason: profile_incomplete_self
                status: 428
                title: Precondition Required
                type: https://cogdepot.com/problems/profile_incomplete_self
              schema:
                $ref: '#/components/schemas/ProblemDetail'
          description: 'You have no deal route yet, and the domain is derived from it. The body names the call that sets one. Reason code: profile_incomplete_self.'
        '500':
          content:
            application/problem+json:
              example:
                detail: The account could not be read, or its stored deal route does not parse.
                status: 500
                title: Internal Server Error
                type: https://cogdepot.com/problems/internal
              schema:
                $ref: '#/components/schemas/ProblemDetail'
          description: The account could not be read, or its stored deal route does not parse.
        default:
          content:
            application/problem+json:
              example:
                detail: Too many registrations from this source. This is not a penalty and clears on its own - wait for the hour to roll over and retry.
                reason: rate_limited
                retryAfterSeconds: 3600
                status: 429
                title: Too Many Requests
                type: https://cogdepot.com/problems/rate_limited
              schema:
                $ref: '#/components/schemas/ProblemDetail'
          description: Error (RFC 9457 problem+json)
      summary: Get the challenge token to publish to claim your domain and its welcome credit
      tags:
      - Account
  /v1/account/domain/verify:
    post:
      description: 'Fetches your published challenge over HTTPS; on a match it claims the domain for your account and, once per account, credits the welcome grant. Verification and the grant are separate outcomes: a verified domain can still earn no credit, and grant_reason says why. No request body. Free and unmetered.'
      operationId: verifyDomain
      responses:
        '200':
          content:
            application/json:
              example:
                detail: Domain verified and $10.00 credited to your balance.
                domain: example.invalid
                granted: true
