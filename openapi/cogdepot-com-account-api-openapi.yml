  /v1/account/register:
    post:
      description: 'Creates an account with no credentials: send {"accepted_terms": true} and the api_key comes back in the response body once, never to be reissued. The account starts with zero credit; take the welcome credit by proving a domain, or fund it. Rate limited per source. An optional Idempotency-Key makes a retry return the account already created instead of a second one.'
      operationId: registerAccount
      parameters:
      - description: 'UUID per logical request. Reusing the same key on a retry answers 200 with the account already created (existing: true) instead of re-executing - without the api_key, which is only ever shown on the 201 that created it.'
        example: 6c1b0f5a-2d9e-4c73-8a41-0b5e7d2c9f36
        in: header
        name: Idempotency-Key
        required: false
        schema:
          format: uuid
          type: string
      requestBody:
        content:
          application/json:
            example:
              accepted_terms: true
            schema:
              $ref: '#/components/schemas/RegisterAccountRequest'
        required: true
      responses:
        '200':
          content:
            application/json:
              example:
                account_id: 3c8f5b21-9e04-4a77-b6d3-1f24e8a05c9b
                existing: true
              schema:
                $ref: '#/components/schemas/RegisterAccountResponse'
          description: 'Idempotent replay: this Idempotency-Key already registered an account. The body carries account_id and existing: true, and deliberately NOT the api_key - a key is shown once, on the 201 that created it, and can never be re-read.'
