              schema:
                $ref: '#/components/schemas/ProblemDetail'
          description: 'You have no deal route yet, so there is no domain to verify. Reason code: profile_incomplete_self.'
        '429':
          content:
            application/problem+json:
              example:
                detail: Too many verification attempts on this account this hour. Wait for retryAfterSeconds.
                reason: rate_limited
