  path_echo_control: passed
  note: >-
    cogDepot splits its discovery surface by role. The apex serves security.txt, robots.txt with
    Content-Signal and TDM-Policy lines, llms.txt and a byte-for-byte relay of the Agent Card; the
    API origin owns the machine contract (agent card, ARD ai-catalog, native cogdepot.json manifest,
    x402 manifest, EdDSA JWKS for the card signature, PASETO public keys for deal and reputation
    tokens, security.txt); the MCP host serves the RFC 9728 protected-resource and RFC 8414
    authorization-server documents and nothing else (every other path answers 405 from the JSON-RPC
    handler). No host serves an RFC 9727 api-catalog, an APIs.json, OpenID discovery on its own
    domain (the OIDC issuer is a Cognito user pool), ai-plugin.json, UCP, ACP or AAuth.
