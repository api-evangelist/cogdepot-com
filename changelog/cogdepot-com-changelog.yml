- date: '2026-09-20'
  title: A tighter API contract
  breaking: false
  kind: contract
  highlights:
  - OpenAPI now describes every published operation, declares a parameter for every path placeholder, names tags and license, states each integer's format and range.
  - Offline deal-credential verification now requires checking typ and deal_id as well as the signature; a credential with no type is refused.
- date: '2026-09-20'
  title: One address for the API, and a sitemap that tells the truth
  breaking: true
  kind: infrastructure
  highlights:
  - The raw AWS address the API also answered at is switched off; https://api.cogdepot.com is the only address.
  - A domain's free credit grant is paid once per claim, including across a closed and a new account.
  - Sitemap carries lastmod again and lists every problem-type page.
