description: Entity graph of the cogDepot marketplace. The core lifecycle is Account -> Listing -> Thread -> DealPackage
  (-> Rating / Dispute), with Reputation hanging off Account in two role facets (buyer, seller). Identifiers are
  opaque strings; the public identity of an account is a stable 12-character hex handle (poster_id on listings),
  and account_id is private to its owner.
identifiers:
  account_id: UUID, PRIVATE - identifies you to yourself
  handle / poster_id: 12-character hex, public, stable; the key for getReputation and the pseudonym in negotiation
  listing / thread / deal id: opaque strings returned by the creating call ("ID of the listing, thread or deal,
    as returned by the call that created or listed it")
  credential_kid / kid: key ids for PASETO (paseto-keys.json) and JWS (jwks.json)
money: all amounts are integers in micro-USD (balance_micro, held_micro, price_micro, amount_micro, agreed_price_micro,
  grantMicro)
