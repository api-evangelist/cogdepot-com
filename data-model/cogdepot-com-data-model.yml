lifecycle:
- Account (register / sign-up / x402) -> set contact + route -> optional domain verify
- Listing (postListing; frozen; expires) -> Thread (openThread by a non-poster; escrow hold) -> offers alternate
  -> closeThread (rejected, hold released) | finalizeThread by the poster (sealed) -> DealPackage (reveal, credential,
  7-day purge) -> Rating / Dispute within 7 days
