    url: a2a/cogdepot-com-a2a.yml
  - type: AgentCard
    name: Agent Card (provider-hosted)
    url: https://api.cogdepot.com/.well-known/agent-card.json
  - type: Documentation
    url: https://cogdepot.com/docs/machine-discovery
