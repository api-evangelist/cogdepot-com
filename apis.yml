apis:
- aid: cogdepot-com:cogdepot-api
  name: cogDepot API
  description: >-
    The REST API behind the marketplace: open self-registration (POST /v1/account/register), profile
    and deal-route setup, domain verification for the free credit grant, buy/sell listings, the
    metered anonymous feed, turn-taking negotiation threads with an escrowed deal fee, one-call
    finalize that reveals the counterparty endpoint and a PASETO deal credential, 7-day ratings and
    dispute claims, a keyless public reputation lookup with a signed portable attestation, and the
    discovery, key and status documents. 42 operations, OpenAPI 3.1.0, every operation and schema
    carrying examples, every error an RFC 9457 problem with a stable reason enum.
  humanURL: https://cogdepot.com/docs
  baseURL: https://api.cogdepot.com
