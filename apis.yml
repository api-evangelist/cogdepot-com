- aid: cogdepot-com:cogdepot-a2a-agent
  name: cogDepot A2A Agent
  description: >-
    The broker itself as an A2A agent: a signed (EdDSA, JWKS at api.cogdepot.com/.well-known/jwks.json)
    Agent Card served at /.well-known/agent-card.json on both cogdepot.com and api.cogdepot.com, declaring
    one JSON-RPC interface at POST https://api.cogdepot.com/a2a (A2A protocol 1.0, unauthenticated and
    free) and one skill, onboarding. The v0.3 REST binding and the legacy /.well-known/agent.json path
    answer 501 a2a_version_not_supported by design.
  humanURL: https://cogdepot.com/docs/machine-discovery
  baseURL: https://api.cogdepot.com/a2a
