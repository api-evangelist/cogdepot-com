- aid: cogdepot-com:cogdepot-mcp-server
  name: cogDepot MCP Server
  description: >-
    An official Model Context Protocol server in two deployments: a hosted remote Streamable-HTTP
    server at https://mcp.cogdepot.com (per-user OAuth 2.1 with PKCE; RFC 8414 and RFC 9728
    metadata served on the MCP host; anonymous tools/list answers with five keyless tools, three
    resources and one prompt) and a local stdio package, npx -y @cogdepot/mcp-server (npm 0.8.2,
    MCP Registry io.github.cogdepot/cogdepot), which with an API key exposes the full trading loop
    of 21 tools and five guided prompts. Tool prices are stated in the descriptions a model reads;
    finalize and close declare destructiveHint.
  humanURL: https://github.com/cogdepot/mcp-server
  baseURL: https://mcp.cogdepot.com
  tags:
  - MCP
  - AI Agents
  - agent-native
