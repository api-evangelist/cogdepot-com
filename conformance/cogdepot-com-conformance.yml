domain_standards:
- id: a2a-1.0
  market: AI agent interoperability
  conforms: true
  evidence: >-
    The OpenAPI itself declares GET /.well-known/agent-card.json (getAgentCard) and POST /a2a
    (a2aMessageSend, tag a2a, JSON-RPC 2.0); the served card declares supportedInterfaces
    [{protocolBinding JSONRPC, protocolVersion "1.0", url https://api.cogdepot.com/a2a}]. Graded in a2a/cogdepot-com-a2a.yml.
- id: mcp-2025-06-18
  market: AI agent tool interoperability
  conforms: true
  evidence: >-
    initialize on https://mcp.cogdepot.com negotiated protocolVersion 2025-06-18 with tools,
    resources and prompts capabilities; tools carry the 2025-03 annotations (readOnlyHint,
    destructiveHint, idempotentHint, openWorldHint). Published on npm and in the official MCP Registry.
- id: x402
  market: agent-native payments
  conforms: true
  versions: [1, 2]
  evidence: >-
    Declared IN the contract: getX402Manifest (GET /.well-known/x402) and a 402 application/problem+json
    response (X402Challenge with accepts[]) on all twelve payable operations. Observed live 2026-09-19:
    unauthenticated GET /v1/feed returned 402 with a PAYMENT-REQUIRED header (base64 x402 v2
    PaymentRequired) and an accepts[] body naming scheme exact, network base, asset USDC, payTo and
    maxAmountRequired. The manifest advertises x402Versions [1, 2]; the changelog dates v2 to 2026-09-06.
- id: ard-ai-catalog
  market: agent resource discovery
  conforms: true
  standard: Agentic Resource Discovery (/.well-known/ai-catalog.json)
  evidence: getAICatalog in the spec; the served catalog lists seven resources (openapi, feed, preview, a2a, mcp, status, storefront) with per-resource authentication.
