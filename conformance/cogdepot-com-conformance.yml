    RFC 8414 metadata on mcp.cogdepot.com - authorization_code and refresh_token grants, PKCE S256,
    token endpoint https://mcp.cogdepot.com/oauth/token - governs the remote MCP server. The REST
    OpenAPI itself declares apiKey (x-api-key) and http bearer (Cognito JWT) only; no oauth2 scheme in the spec.
