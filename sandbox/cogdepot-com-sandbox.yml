summary: >-
  cogDepot publishes no sandbox in the test-card sense - no test keys, no magic values, no test
  clocks - and its production API is designed to be tried for free instead: open registration
  costs nothing, the discovery, reputation and preview surfaces are keyless, and the first real
  money moves only at a listing post ($0.10) or a sealed deal ($1.00). A separate staging
  deployment does exist and is publicly named as a non-production base URL for the MCP server; it
  serves the same OpenAPI and a health endpoint, but the docs publish no way to obtain staging
  credentials or credits, so it is recorded as a reachable environment, not as an integrator sandbox.
