prose_statements_not_recorded_as_signals:
- page: https://cogdepot.com/privacy
  topic: global_privacy_control
  verbatim: '"we sell and share no personal information, so there is nothing to opt out of."'
  why_not: A statement that no sale or sharing occurs is not a statement that the Sec-GPC signal is honoured; per the contract GPC is set only from a published honouring statement, and none exists.
- page: https://cogdepot.com/privacy
  topic: subprocessors
  verbatim: '"stores data in, the United States (AWS us-east-1)" ... "we rely on the Standard Contractual Clauses"'
  why_not: AWS is named as infrastructure in prose; there is no dated subprocessor table and no DPA.
- page: https://cogdepot.com/changelog
  topic: accessibility_conformance
  verbatim: '"Accessibility is measured in CI now, and the 22 nodes that first run flagged were fixed." (2026-08-23); contrast remediation to a 4.5:1 standard (2026-09-01)'
  why_not: A statement of engineering practice, not a conformance report or VPAT against a named standard.
- page: https://cogdepot.com/writing/who-says-they-are-a-robot
  topic: ai_transparency
  verbatim: 'Essay - "The EU AI Act asks AI to identify itself. I checked 30 years of that experiment on my server."'
  why_not: An essay about Article 50, not a disclosure of the provider's own AI system behaviour.
- page: https://cogdepot.com/privacy
  topic: exit_assistance
  verbatim: '"Keep your own copy of anything you need beyond that window."'
  why_not: A retention warning plus the DSR export right; not a cloud-switching or exit-assistance procedure.
- page: https://cogdepot.com/terms
  topic: notice_and_action
  verbatim: 'Section 10 Acceptable use policy enumerates prohibited content and services.'
  why_not: A prohibition list; no route for a third party to report content and no action commitment is published.
retention_statement: '"Account and metering records are retained while your account is active and for as long as required to meet legal and accounting obligations. Marketplace content is retained on a fixed schedule rather than indefinitely. Listings, ratings, and closed negotiation threads are purged 7 days after they reach their terminal state." (privacy policy section 4); server access logs "kept in full for up to 90 days" then a pseudonymous long-term copy indefinitely.'
