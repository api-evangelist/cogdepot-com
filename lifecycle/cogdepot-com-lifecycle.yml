deprecation:
  policy_url: null
  sunset_header: false
  deprecation_header: false
  notes: >-
    No deprecation policy page and no RFC 8594 Sunset/Deprecation header support is documented. Two
    published commitments stand in for one, narrowly: (1) the webhook binding identifier
    https://cogdepot.com/bindings/webhook-v1 states its meaning is frozen and "anything that would
    change what an existing declaration promises gets a new identifier rather than an edit here";
    (2) the A2A v0.3 REST binding and /.well-known/agent.json answer 501 a2a_version_not_supported,
    documented as "not served and never will be". Contract changes are announced in the dated
    changelog (e.g. 2026-09-20 "A tighter API contract", 2026-09-06 x402 v2 added alongside v1 with
    the v1 body kept byte-for-byte). No Deprecation pointer is emitted because no general policy exists.
